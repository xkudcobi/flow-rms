<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FLOW Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000000",
                        "secondary-fixed-dim": "#b1c5ff",
                        "secondary-container": "#256df0",
                        "surface-container-low": "#f3f3f3",
                        "tertiary-fixed": "#7cfca5",
                        "tertiary-fixed-dim": "#5ede8b",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-highest": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "on-secondary-container": "#fefcff",
                        "inverse-primary": "#c6c6c6",
                        "outline-variant": "#cfc4c5",
                        "surface-container": "#eeeeee",
                        "secondary": "#0054cb",
                        "surface-dim": "#dadada",
                        "on-background": "#1a1c1c",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#474747",
                        "on-surface-variant": "#4c4546",
                        "inverse-surface": "#2f3131",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#00419f",
                        "on-tertiary-container": "#009850",
                        "primary-fixed-dim": "#c6c6c6",
                        "surface": "#f9f9f9",
                        "on-secondary-fixed": "#001947",
                        "on-tertiary-fixed-variant": "#005229",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#00210d",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed": "#dae2ff",
                        "primary-fixed": "#e2e2e2",
                        "surface-variant": "#e2e2e2",
                        "on-surface": "#1a1c1c",
                        "background": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#848484",
                        "on-primary-fixed": "#1b1b1b",
                        "tertiary-container": "#00210d",
                        "primary-container": "#1b1b1b",
                        "surface-tint": "#5e5e5e",
                        "outline": "#7e7576"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "16px",
                        "base": "4px",
                        "xs": "8px",
                        "md": "24px",
                        "gutter": "16px",
                        "lg": "32px",
                        "xl": "48px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Outfit"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Outfit"],
                        "mono-data": ["monospace"],
                        "title-lg": ["Inter"],
                        "headline-md": ["Outfit"],
                        "display-lg": ["Outfit"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center font-body-lg">
<!-- Main Container -->
<div class="w-full max-w-md px-container-margin py-xl flex flex-col justify-center">
<!-- Logo Header -->
<div class="flex justify-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter">FLOW</h1>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md w-full">
<!-- Input Group: Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username</label>
<div class="relative w-full">
<input class="w-full bg-surface-container-lowest border border-surface-container-high focus:border-primary focus:ring-0 rounded h-14 px-sm font-body-md text-body-md text-on-surface transition-colors outline-none" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative w-full">
<input class="w-full bg-surface-container-lowest border border-surface-container-high focus:border-primary focus:ring-0 rounded h-14 px-sm font-body-md text-body-md text-on-surface transition-colors outline-none" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-base">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<!-- Action Button -->
<button class="mt-sm w-full bg-primary text-on-primary rounded h-14 flex items-center justify-center font-title-lg text-title-lg transition-transform hover:opacity-90 active:scale-[0.98] active:opacity-100 shadow-sm" type="button">
                Giriş Yap
            </button>
</form>
<!-- Footer / Support -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Need help? <a class="text-primary font-label-md hover:underline" href="#">Contact Support</a></p>
</div>
</div>
</body></html>
